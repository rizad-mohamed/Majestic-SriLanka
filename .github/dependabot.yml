version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Astro check and typescript-eslint do not yet support TypeScript 7.
    # Remove this deferral after both tools declare support and CI passes.
    ignore:
      - dependency-name: typescript
        versions: ["7.x"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
